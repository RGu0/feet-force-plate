name: Quality gates

on:
  push:
  pull_request:

jobs:
  artifact-consumer:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies from public Foundation Release
        run: uv sync --extra dev --locked
      - name: Static quality gates
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev mypy shared/contracts cloud/observability
      - name: Full governed test suite
        run: uv run --extra dev python -m pytest --junitxml=pytest-results.xml
      - name: Unprivileged integration public bundle root gate
        if: runner.os == 'Linux'
        run: >-
          uv run --extra dev python -m pytest -p no:cacheprovider
          cloud/tests/test_integration_public_bundle.py
      - name: Root-run integration public bundle regression
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test_python="$(uv run --extra dev python -c 'import sys; print(sys.executable)')"
          sudo env "PATH=$PATH" "$test_python" -m pytest -p no:cacheprovider cloud/tests/test_integration_public_bundle.py
      - name: Clean Windows managed Python bootstrap regression
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_clean_windows_managed_python_bootstrap.ps1
      - name: Archive test result
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: error
      - name: Archive mobile contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-contracts-${{ matrix.os }}-${{ github.sha }}
          path: cloud/contracts/mobile/*.json
          if-no-files-found: error
