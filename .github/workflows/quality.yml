name: Quality gates

on:
  push:
  pull_request:

jobs:
  foundation:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: ${{ matrix.python }}
      - name: Verify locked environment
        run: uv sync --extra dev --locked
      - name: Static quality gates
        run: |
          uv run --extra dev ruff check .
          uv run --extra dev mypy shared/contracts cloud/observability
      - name: Contract and reliability regression
        run: >-
          uv run --extra dev python -m pytest
          client/tests/test_ray_91_protocol.py
          client/tests/test_ray_91_reference_protocol_fixture.py
          client/tests/test_institution_store.py
          client/tests/test_p3_persistent_upload.py
          client/tests/test_ray_99_packaged_upload_runtime.py
          tests/spool/test_recovery.py
          tests/spool/test_valid_session_commit.py
          cloud/tests/test_client_sync_contract.py
          cloud/tests/test_segment_ingestion.py
          tests/cloud/analysis/test_orchestrator.py
          tests/cloud/observability/test_events.py
          --junitxml=pytest-results.xml
      - name: Archive test result
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python }}
          path: pytest-results.xml
          if-no-files-found: error

  foundation-release-baseline:
    name: Foundation release security baseline
    needs: foundation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"
          python-version: "3.11"
      - name: Verify locked environment and dependency audit
        run: |
          uv sync --extra dev --locked
          uv export --locked --extra dev --no-emit-workspace --no-hashes --format requirements-txt > audited-requirements.txt
          uv run --extra dev pip-audit --strict -r audited-requirements.txt --progress-spinner off
      - name: Build foundation distribution
        run: uv build packages/techflex-cloud-foundation --out-dir foundation-dist
      - name: Record SBOM, source and performance evidence
        run: >-
          uv run --extra dev python scripts/record_foundation_release_baseline.py
          --project-root .
          --dist-dir foundation-dist
          --baseline-strategy legacy-httpx-client/1
          --output foundation-release-evidence.json
      - name: Archive foundation release evidence
        uses: actions/upload-artifact@v4
        with:
          name: foundation-release-evidence
          path: |
            foundation-dist/
            foundation-release-evidence.json
          if-no-files-found: error
