[project]
name = "feetforceplate"
version = "0.1.0"
description = "足底压力力台 PC 上位机：实时采集、可视化、算法分析、记录回放、报告输出与云端授权管理"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # GUI
    "PySide6",
    "pyqtgraph",
    # 设备接入
    "pyserial",
    # 数值计算 / 算法
    "numpy",
    "scipy",
    # 数据存储
    "h5py",
    "SQLAlchemy",
    "alembic",
    # 云端通信
    "httpx",
    # 云端 API 与共享契约
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "asyncpg>=0.30,<1",
    "boto3>=1.39,<2",
    # 许可签名
    "cryptography",
    # 报告生成
    "Jinja2",
    "matplotlib",
    # 跨平台路径
    "platformdirs",
    # 系统凭据库（macOS Keychain / Windows Credential Vault）
    "keyring",
]

[project.optional-dependencies]
# 打包分发工具（开发期使用，不进入运行时依赖）
build = [
    "pyinstaller",
]
# 开发/测试工具
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4,<5",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "pre-commit>=4,<5",
]

[tool.uv]
# 仅安装当前项目依赖，不把项目本身作为可安装包构建
package = false

[tool.pytest.ini_options]
testpaths = ["client/tests", "cloud/tests", "tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
extend-exclude = ["docs/evidence", "tmp"]

[tool.ruff.lint]
# The established codebase predates automatic formatting.  Start with fatal
# correctness findings; style rules can be enabled only after a dedicated
# repository-wide formatting change is reviewed separately.
select = ["F"]

[tool.mypy]
python_version = "3.11"
# This initial gate protects the versioned cross-process contract and the
# privacy boundary. Qt presentation and numerical pipelines need a dedicated
# typing remediation before they can become a reliable blocking gate.
files = ["shared/contracts", "cloud/observability"]
ignore_missing_imports = true
follow_imports = "silent"
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
